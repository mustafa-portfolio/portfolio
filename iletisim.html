    <!-- İLETİŞİM FORMU (MODERN & GLASSMORKİF) -->
<div class="contact-card-wrapper">
    <form action="https://formspree.io/f/mlgqwjyj" method="POST" class="contact-form glass-card">
        
        <div class="form-header">
            <h3>Bana Ulaşın 👋</h3>
            <p>Projeler, iş birlikleri veya sadece sohbet etmek için mesaj bırakabilirsiniz.</p>
        </div>

        <div class="form-group">
            <label for="name">
                <span>👤</span> Adınız Soyadınız
            </label>
            <input type="text" id="name" name="name" required placeholder="Erşan Işın" autocomplete="name">
        </div>

        <div class="form-group">
            <label for="email">
                <span>✉️</span> E-posta Adresiniz
            </label>
            <input type="email" id="email" name="_replyto" required placeholder="ersan@example.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label for="message">
                <span>💬</span> Mesajınız
            </label>
            <textarea id="message" name="message" rows="4" required placeholder="Aklınızdaki projeyi veya sorunuzu yazın..."></textarea>
        </div>

        <button type="submit" class="btn-primary submit-btn">
            <span>Mesajı Gönder</span>
            <span class="btn-icon">🚀</span>
        </button>

    </form>
</div>
    </main>
