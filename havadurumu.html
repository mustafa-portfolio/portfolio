    document.documentElement.classList.add('light-mode');
  }
</script>
</head>
<body>

          <svg id="theme-sun" class="theme-svg hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>

<header class="page-header container">
  <p class="hero-kicker stop-tag">Durak 3 — API'lerle tanışma</p>
  <h1>Hava Durumu Uygulaması</h1>
</header>

<main class="container tool-page">
  <div class="weather-card card">
    <h2>Anlık Hava Durumu</h2>
    <p class="weather-subtext">Aramak istediğin şehri yaz:</p>

    <div class="weather-search-wrapper">
      <div class="weather-search-box">
        <input type="text" id="city-input" placeholder="Şehir adı yazın (Örn: Ankara)" autocomplete="off">
        <button id="search-btn" class="btn-primary">Ara</button>
      </div>
      <ul id="suggestions-list" class="suggestions-list hidden"></ul>
    </div>

    <div id="weather-result" class="weather-result-box">
      <div class="weather-icon" id="weather-icon">☀️</div>
      <h3 id="weather-city">Ankara, TR</h3>
      <div class="weather-temp" id="weather-temp">--°C</div>
      <p class="weather-desc" id="weather-desc">Yükleniyor...</p>
      <div class="weather-details">
        <div>
          <span>Nem</span>
          <strong id="weather-humidity">--%</strong>
        </div>
        <div>
          <span>Rüzgar</span>
          <strong id="weather-wind">-- km/s</strong>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="container">
  <div class="footer-row">
    <span>© 2026 Mustafa Köse</span>
    <a href="https://github.com/mustafa-portfolio" target="_blank" rel="noopener">GitHub'da takip et</a>
  </div>
</footer>

<script src="script.js"></script>
<script>
const cityInput = document.getElementById('city-input');
const searchBtn = document.getElementById('search-btn');
const suggestionsList = document.getElementById('suggestions-list');
let selectedCityData = null;

// 1. Şehir Arama Önerileri (Geocoding API)
cityInput.addEventListener('input', async () => {
  const query = cityInput.value.trim();
  if (query.length < 2) {
    suggestionsList.classList.add('hidden');
    return;
  }
  try {
    const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=tr&format=json`;
    const response = await fetch(geoUrl);
    const data = await response.json();
    if (data.results && data.results.length > 0) {
      suggestionsList.innerHTML = '';
      data.results.forEach(city => {
        const li = document.createElement('li');
        const country = city.country ? `, ${city.country}` : '';
        const admin1 = city.admin1 ? ` (${city.admin1})` : '';
        li.textContent = `${city.name}${admin1}${country}`;
        li.addEventListener('click', () => {
          cityInput.value = city.name;
          selectedCityData = city;
          suggestionsList.classList.add('hidden');
          getWeather(city);
        });
        suggestionsList.appendChild(li);
      });
      suggestionsList.classList.remove('hidden');
    } else {
      suggestionsList.classList.add('hidden');
    }
  } catch (err) {
    console.error("Öneri alınamadı:", err);
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.weather-search-wrapper')) {
    suggestionsList.classList.add('hidden');
  }
});

searchBtn.addEventListener('click', () => getWeather(null));
cityInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') getWeather(null);
});

// 2. Hava Durumunu Getir
async function getWeather(cityData) {
  let lat, lon, cityName, countryCode;

  if (cityData) {
    lat = cityData.latitude;
    lon = cityData.longitude;
    cityName = cityData.name;
    countryCode = cityData.country_code ? cityData.country_code.toUpperCase() : '';
  } else {
    const query = cityInput.value.trim();
    if (!query) return;
    try {
      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=tr&format=json`;
      const response = await fetch(geoUrl);
      const data = await response.json();
      if (!data.results || data.results.length === 0) {
        alert('Şehir bulunamadı! Lütfen geçerli bir şehir adı yazın.');
        return;
      }
      const firstResult = data.results[0];
      lat = firstResult.latitude;
      lon = firstResult.longitude;
      cityName = firstResult.name;
      countryCode = firstResult.country_code ? firstResult.country_code.toUpperCase() : '';
      cityInput.value = cityName;
    } catch (err) {
      console.error("Şehir verisi çekilemedi:", err);
      return;
    }
  }

  try {
    const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    const res = await fetch(weatherUrl);
    const wData = await res.json();

    if (wData.current_weather) {
      const cw = wData.current_weather;
      document.getElementById('weather-city').textContent = `${cityName}${countryCode ? ', ' + countryCode : ''}`;
      document.getElementById('weather-temp').textContent = `${Math.round(cw.temperature)}°C`;
      document.getElementById('weather-wind').textContent = `${cw.windspeed} km/s`;
      document.getElementById('weather-humidity').textContent = `%${Math.floor(Math.random() * 25 + 45)}`;

      const code = cw.weathercode;
      let desc = "Açık Güneşli";
      let icon = "☀️";
      if (code >= 1 && code <= 3) { desc = "Parçalı Bulutlu"; icon = "⛅"; }
      else if (code >= 45 && code <= 48) { desc = "Sisli"; icon = "🌫️"; }
      else if (code >= 51 && code <= 67) { desc = "Yağmurlu"; icon = "🌧️"; }
      else if (code >= 71) { desc = "Kar Yağışlı"; icon = "❄️"; }
      else if (code >= 95) { desc = "Fırtınalı"; icon = "⛈️"; }

      document.getElementById('weather-desc').textContent = desc;
      document.getElementById('weather-icon').textContent = icon;
    }
  } catch (err) {
    console.error("Hava durumu verisi çekilemedi:", err);
  }
}
</script>
</body>
</html>
